[project]
name = "rlm-api"
version = "0.1.0"
description = "Durable DSPy Recursive Language Model API"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30.0",
  "dspy>=3.2.1,<4",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "robyn>=0.63.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
